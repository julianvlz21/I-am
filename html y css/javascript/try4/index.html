<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <p id="texto">algo</p>
        <button onclick="cambiar()">Dale!!</button>
    </div>

    <script>
        const txt = document.getElementById("texto");

        function cambiar() {
        const nuevaFrase = "algo más grande";
        txt.textContent = nuevaFrase;

        }

    </script>
</body>
</html>
